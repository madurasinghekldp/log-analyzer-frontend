<!-- logs.component.html -->
<mat-toolbar color="primary">
  <span>Log Analyzer</span>
</mat-toolbar>

<div class="filters">
  <!-- Global Search -->
  <mat-form-field appearance="fill">
    <mat-label>Search logs</mat-label>
    <input matInput (keyup)="applyGlobalFilter($event)" placeholder="Search by any field">
  </mat-form-field>

  <!-- Log Level Filter -->
  <mat-form-field appearance="fill">
    <mat-label>Log Level</mat-label>
    <mat-select (selectionChange)="filterByLevel($event.value)">
      <mat-option value="">All</mat-option>
      <mat-option value="ERROR">Error</mat-option>
      <mat-option value="WARN">Warn</mat-option>
      <mat-option value="INFO">Info</mat-option>
    </mat-select>
  </mat-form-field>
</div>

<!-- Table -->
<table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
  
  <!-- Timestamp -->
  <ng-container matColumnDef="timestamp">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Timestamp</th>
    <td mat-cell *matCellDef="let log">{{ log.timestamp }}</td>
  </ng-container>

  <!-- Level -->
  <ng-container matColumnDef="level">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Level</th>
    <td mat-cell *matCellDef="let log">{{ log.level }}</td>
  </ng-container>

  <!-- Message -->
  <ng-container matColumnDef="message">
    <th mat-header-cell *matHeaderCellDef>Message</th>
    <td mat-cell *matCellDef="let log">{{ log.message }}</td>
  </ng-container>

  <!-- Header & Row -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<!-- Pagination -->
<mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]"></mat-paginator>
